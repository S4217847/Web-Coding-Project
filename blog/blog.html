  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | RMIT Connect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">RMIT CONNECT</div>
    <form action="#" class="searchbar" role="search">
      <label class="text-label" for="blog-search">Search blogs</label>
      <input type="search" id="blog-search" placeholder="Search RMIT Connect..." class="search-input">
      <label class="text-label" for="search-category">Search category</label>
      <select id="search-category" class="search-categories" aria-label="Search category">
        <option value="all">All</option>
        <option value="name">Author</option>
        <option value="id">SID</option>
        <option value="tags">Tags</option>
      </select>
    </form>

    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Discussions</a></li>
        <li><a href="#">My Blog</a></li>
        <li><a href="#">My Profile</a></li>
      </ul>
    </nav>
  </header>

<main class="page">
  <aside class="leftbar" aria-label="Personal navigation">
    <div class="menu-card">
      <ul>
        <li><a href="#">My Feed</a></li>
        <li><a href="#">My Clubs</a></li>
        <li><a href="#">Saved Posts</a></li>
        <li><a href="#">Favourites</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </div>

  </aside>

  <section class="middle" aria-labelledby="recent-blogs-title">

    <form class="articlebox" id="create-blog-form" action="#" method="post" novalidate>
      <label class="text-label" for="blog-title">Blog title</label>
      <input class="article-input" id="blog-title" name="title" type="text" placeholder="Blog title" required maxlength="120">
      <small class="field-error" id="blog-title-error" aria-live="polite"></small>
      <label class="text-label" for="blog-tags">Blog tags</label>
      <input class="article-input" id="blog-tags" name="tags" type="text" placeholder="Tags (for example: Technology, Business)">
      <label class="text-label" for="blog-content">Blog content</label>
      <textarea id="blog-content" name="content" placeholder="Write something for your blog..." required></textarea>
      <small class="field-error" id="blog-content-error" aria-live="polite"></small>
      <div class="articlefooter">
        <input type="file" id="imageUpload" name="image" accept="image/*" class="text-label">
        <label for="imageUpload" class="upload-btn">
        📷 Upload image
        </label>
        <button class="articlebtn" type="submit">Post</button>
      </div>
      <small class="field-error" id="blog-image-error" aria-live="polite"></small>
      <p class="form-status" id="blog-form-status" aria-live="polite"></p>
    </form>

    <div class="contentbox">
      <div class="content clearfix">

        <div class="main-content">
          <h1 class="recent-article-title" id="recent-blogs-title">Recent blogs</h1>

          <p class="list-status" id="blog-list-status" aria-live="polite">Loading blogs...</p>
          <div id="blog-list"></div>
        </div>
        
      </div>
    </div>
   
  </section>

  <aside class="rightbar" aria-label="Events and online friends">

    <div class="itembar">
      <div class="itemtitle">Upcoming Events</div>
      <div class="eventitem">
        <span class="eventdate">Jul #</span> - Coding Contest
      </div>
      <div class="eventitem">
        <span class="eventdate">Jul #</span> - Something Contest
      </div>
      <div class="eventitem">
        <span class="eventdate">Jul #</span> - Contest Contest
      </div>
    </div>

    <div class="itembar">
      <div class="itemtitle">Friends Online</div>
      <div class="frienditem">
        <div class="friendavatar"></div>
        <div class="friendname">Kim</div>
      </div>
      <div class="frienditem">
        <div class="friendavatar"></div>
        <div class="friendname">Dat</div>
      </div>
      <div class="frienditem">
        <div class="friendavatar"></div>
        <div class="friendname">Hoang</div>
      </div>
    </div>
  </aside>
  
</main>
<script src="blog.js" defer></script>
</body>
</html>
