<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deactivate Account | RMIT Connect</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="deactivate.css" />
  </head>

  <body>
    <header>
      <div class="logo">RMIT CONNECT</div>
      <input
        class="searchbar"
        type="text"
        placeholder="Search RMIT Connect..."
      />

      <nav>
        <ul>
          <li><a href="/sitemap.html">Home</a></li>
          <li><a href="/blog/discussion.html">Discussions</a></li>
          <li><a href="/blog/blog.html">My Blog</a></li>
          <li><a href="/profile/profile.html">My Profile</a></li>
        </ul>
      </nav>
    </header>

    <div class="deactivate-page">
      <div class="deactivate-card">
        <h1>Deactivate Account</h1>

        <p class="deactivate-text">
          You are about to deactivate your RMIT Connect account.
        </p>

        <p class="deactivate-warning">
          You will not be able to log in or access your account while it is
          deactivated.
        </p>

        <form
          id="deactivate-form"
          class="deactivate-form"
          action="deactivated-success.html"
        >
          <label class="deactivate-checkbox">
            <input
              id="deactivate-id-confirm"
              name="deactivate-id-confirm"
              type="checkbox"
              required
            />
            I understand that my account will be deactivated.
          </label>

          <div class="error" id="deactivate-error-text"></div>

          <button class="deactivatebutton" type="submit">
            Deactivate Account
          </button>
        </form>

        <p class="account-help">
          <a href="/sitemap.html" class="common-link">Cancel</a>
        </p>
      </div>
    </div>
    <script src="deactivate.js"></script>
  </body>
</html>
